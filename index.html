<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4F3C">
<title>Modu Modu</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin 0.9s linear infinite}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}
@keyframes spA{0%{transform:translateX(-40px);opacity:0}60%{opacity:1}100%{transform:translateX(0);opacity:1}}
@keyframes spB{0%{transform:translateX(40px);opacity:0}60%{opacity:1}100%{transform:translateX(0);opacity:1}}
@keyframes spUp{0%{transform:translateY(14px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes spOut{to{opacity:0}}
.splash{animation:spOut 0.4s ease 2.5s forwards}
.sp-a{animation:spA 0.8s cubic-bezier(0.2,0.8,0.2,1) both}
.sp-b{animation:spB 0.8s cubic-bezier(0.2,0.8,0.2,1) both}
.sp-word{opacity:0;animation:spUp 0.6s ease 0.9s forwards}
.sp-tag{opacity:0;animation:spUp 0.6s ease 1.5s forwards}
@media (prefers-reduced-motion: reduce){.sp-a,.sp-b{animation:none}.sp-word,.sp-tag{animation:none;opacity:1}}
</style>

<style>
html,body{height:100%;margin:0;background:#E6ECE9}
#stage{min-height:100%;display:flex;align-items:flex-start;justify-content:center}
#frame{position:relative;overflow:hidden}
#root{transform-origin:0 0;width:390px;height:844px}
@media (min-width:600px){#frame{box-shadow:0 20px 60px rgba(11,79,60,.25);border-radius:28px;margin:16px 0}}
</style>
</head>
<body>
<div id="stage"><div id="frame"><div id="root"></div></div></div>
<script type="text/template" id="tpl">
<div style="width:390px;height:844px;position:relative;overflow:hidden;display:flex;flex-direction:column;background:#F4F6F5;color:#14201B;font-family:'DM Sans',system-ui,sans-serif;font-size:15px">

<div style="flex:1;min-height:0;display:flex;flex-direction:column">

<!-- HOME -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="flex:1;min-height:0;overflow-y:auto;padding:24px 20px 20px;display:flex;flex-direction:column;gap:20px">
  <div style="display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:14px;color:#55625C">Welcome back</span>
      <div style="display:flex;align-items:center;gap:8px">
        <svg aria-hidden="true" width="38" height="24" viewBox="0 0 38 24"><circle cx="12" cy="12" r="11" fill="#0B4F3C"/><circle cx="26" cy="12" r="11" fill="#F2B33D" stroke="#F4F6F5" stroke-width="2"/></svg>
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:24px;color:#0B4F3C">{{brandName}}</span>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <button aria-label="Notifications" onClick="{{toggleDrawer}}" style="position:relative;width:48px;height:48px;border-radius:50%;border:1.5px solid #DCE3DF;background:#FFFFFF;color:#14201B;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
        <sc-if value="{{showReminder}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position:absolute;top:9px;right:11px;width:10px;height:10px;border-radius:50%;background:#D93025;border:2px solid #FFFFFF"></span></sc-if>
      </button>
      <button aria-label="Profile and settings" onClick="{{openProfile}}" style="width:48px;height:48px;border-radius:50%;border:0;background:#E3EFE9;color:#0B4F3C;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer">You</button>
    </div>
  </div>

  <div style="background:#0B4F3C;color:#FFFFFF;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:28px;line-height:1.1">Send to Senegal</span>
      <span style="font-size:14px;color:#CFE3DA">For every Modu Modu. Wave or Orange Money, once or on repeat.</span>
    </div>
    <span style="font-size:14px;color:#CFE3DA">1 USD = 580 FCFA · sample rate</span>
    <div style="display:flex;gap:10px">
      <button onClick="{{openSendOnce}}" style="flex:1;height:48px;border:0;border-radius:14px;background:#F2B33D;color:#14201B;font-weight:600;font-size:15px;cursor:pointer">Send money</button>
      <button onClick="{{openSendRecurring}}" style="flex:1;height:48px;border:1.5px solid #8FB5A5;border-radius:14px;background:transparent;color:#FFFFFF;font-weight:600;font-size:15px;cursor:pointer">Set up recurring</button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700">Send again</h2>
    <div style="display:flex;gap:14px;flex-wrap:wrap">
      <sc-for list="{{homeRecipients}}" as="r" hint-placeholder-count="2">
      <button onClick="{{r.pick}}" style="display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;color:#14201B;min-width:72px;padding:4px">
        <span aria-hidden="true" style="width:56px;height:56px;border-radius:50%;background:#E3EFE9;color:#0B4F3C;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center">{{r.initials}}</span>
        <span style="font-size:14px;font-weight:500">{{r.name}}</span>
      </button>
      </sc-for>
      <button onClick="{{addFromHome}}" style="display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:transparent;cursor:pointer;color:#14201B;min-width:72px;padding:4px">
        <span aria-hidden="true" style="width:56px;height:56px;border-radius:50%;border:1.5px dashed #0B4F3C;color:#0B4F3C;display:flex;align-items:center;justify-content:center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
        <span style="font-size:14px;font-weight:500">New</span>
      </button>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:18px;font-weight:700">Past transactions</h2>
      <button onClick="{{goActivity}}" style="border:0;background:transparent;color:#0B4F3C;font-weight:600;font-size:14px;height:44px;padding:0 4px;cursor:pointer">See all</button>
    </div>
    <div style="background:#FFFFFF;border:1px solid #DCE3DF;border-radius:20px;padding:0 14px;display:flex;flex-direction:column">
      <sc-for list="{{recentTx}}" as="x" hint-placeholder-count="3">
      <button onClick="{{goActivity}}" style="display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-bottom:1px solid #EEF2F0;background:transparent;padding:12px 0;cursor:pointer;color:#14201B">
        <span aria-hidden="true" style="width:40px;height:40px;border-radius:50%;background:#E3EFE9;color:#0B4F3C;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none">{{x.initials}}</span>
        <span style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-weight:600">To {{x.name}}</span><span style="font-size:14px;color:#55625C">{{x.date}} · {{x.method}}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span style="font-weight:600">{{x.amount}}</span><span style="font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;{{x.statusStyle}}">{{x.status}}</span></span>
      </button>
      </sc-for>
    </div>
  </div>
</div>
</sc-if>

<!-- SEND -->
<sc-if value="{{isSend}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:4px;padding:12px 12px 4px 8px">
  <button aria-label="Back" onClick="{{goHome}}" style="width:44px;height:44px;border:0;background:transparent;color:#14201B;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700">Send money</h1>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:14px;font-weight:600;color:#55625C">To</span>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:10px">
      <sc-for list="{{sendRecipients}}" as="r" hint-placeholder-count="2">
      <button onClick="{{r.pick}}" style="display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid #DCE3DF;background:#FFFFFF;border-radius:16px;padding:10px;cursor:pointer;color:#14201B;min-width:0;{{r.style}}">
        <span aria-hidden="true" style="width:40px;height:40px;border-radius:50%;background:#E3EFE9;color:#0B4F3C;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none">{{r.initials}}</span>
        <span style="display:flex;flex-direction:column;min-width:0"><span style="font-weight:600">{{r.name}}</span><span style="font-size:14px;color:#55625C">{{r.method}}</span></span>
      </button>
      </sc-for>
      <button onClick="{{addFromSend}}" style="display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed #0B4F3C;background:transparent;border-radius:16px;padding:10px;min-height:62px;cursor:pointer;color:#0B4F3C;font-weight:600;font-size:15px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New recipient
      </button>
    </div>
  </div>

  <div style="display:flex;background:#E7ECE9;border-radius:14px;padding:4px;gap:4px">
    <button onClick="{{setOneTime}}" style="flex:1;height:44px;border:0;border-radius:11px;font-weight:600;font-size:15px;cursor:pointer;{{oneStyle}}">One-time</button>
    <button onClick="{{setRecurring}}" style="flex:1;height:44px;border:0;border-radius:11px;font-weight:600;font-size:15px;cursor:pointer;{{recStyle}}">Recurring</button>
  </div>

  <div style="background:#FFFFFF;border:1px solid #DCE3DF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;flex-direction:column;gap:2px">
          <label for="usd-input" style="font-size:14px;font-weight:600;color:#55625C">You send</label>
          <div style="display:flex;align-items:center;gap:8px;border-bottom:2px solid #DCE3DF;padding-bottom:4px;{{usdLine}}">
            <span aria-hidden="true" style="font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:32px;color:#55625C">$</span>
            <input id="usd-input" type="text" inputmode="decimal" autocomplete="off" placeholder="0" aria-describedby="amount-hint" readOnly="{{usdReadOnly}}" value="{{usdValue}}" onInput="{{onUsdInput}}" onChange="{{onUsdInput}}" style="flex:1;min-width:0;border:0;background:transparent;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:32px;color:#14201B;padding:0;height:48px">
            <span aria-hidden="true" style="font-weight:600;font-size:16px;color:#55625C">USD</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <label for="xof-input" style="font-size:14px;font-weight:600;color:#55625C">They receive</label>
          <div style="display:flex;align-items:center;gap:8px;border-bottom:2px solid #DCE3DF;padding-bottom:4px;{{xofLine}}">
            <input id="xof-input" type="text" inputmode="numeric" autocomplete="off" placeholder="0" aria-describedby="amount-hint" readOnly="{{xofReadOnly}}" value="{{xofValue}}" onInput="{{onXofInput}}" onChange="{{onXofInput}}" style="flex:1;min-width:0;border:0;background:transparent;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:32px;color:#14201B;padding:0;height:48px">
            <span aria-hidden="true" style="font-weight:600;font-size:16px;color:#55625C">FCFA</span>
          </div>
        </div>
      </div>
    </div>
    <span id="amount-hint" style="font-size:14px;{{hintStyle}}">{{amountHint}}</span>
    <div style="border-top:1px solid #E7ECE9;padding-top:12px;display:flex;flex-direction:column;gap:2px">
      <span style="font-weight:600">{{convLine1}}</span>
      <span style="font-size:14px;color:#55625C">{{convLine2}}</span>
    </div>
    <span style="font-size:14px;color:#0B4F3C;font-weight:500">Type in either box. The other updates automatically.</span>
  </div>

  <sc-if value="{{recurring}}" hint-placeholder-val="{{ false }}">
  <div style="background:#FFFFFF;border:1px solid #DCE3DF;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:14px;font-weight:600;color:#55625C">How often</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <sc-for list="{{freqOpts}}" as="f" hint-placeholder-count="3">
        <button onClick="{{f.pick}}" style="border:1.5px solid #DCE3DF;background:#FFFFFF;color:#14201B;border-radius:999px;padding:0 14px;height:44px;font-size:14px;font-weight:500;cursor:pointer;{{f.style}}">{{f.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <label for="start-date" style="font-size:14px;font-weight:600;color:#55625C">First transfer date</label>
      <input id="start-date" type="date" min="{{minDate}}" aria-describedby="start-hint" value="{{startStr}}" onInput="{{onStart}}" onChange="{{onStart}}" style="height:48px;border:1.5px solid #DCE3DF;border-radius:12px;padding:0 12px;font-family:inherit;font-size:16px;color:#14201B;background:#FFFFFF;width:100%">
      <span id="start-hint" style="font-size:14px;{{startHintStyle}}">{{startHint}}</span>
    </div>
    <span style="font-size:14px;color:#55625C">Ends: never. Pause, skip or stop any time.</span>
  </div>
  </sc-if>
</div>
<div style="padding:12px 20px 20px;background:#F4F6F5;border-top:1px solid #E1E7E4">
  <button disabled="{{reviewDisabled}}" onClick="{{goReview}}" style="width:100%;height:52px;border:0;border-radius:14px;background:#0B4F3C;color:#FFFFFF;font-weight:600;font-size:16px;cursor:pointer;{{reviewStyle}}">Continue</button>
</div>
</sc-if>

<!-- ADD RECIPIENT -->
<sc-if value="{{isAddRecipient}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:4px;padding:12px 12px 4px 8px">
  <button aria-label="Back" onClick="{{cancelAdd}}" style="width:44px;height:44px;border:0;background:transparent;color:#14201B;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700">New recipient</h1>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:8px 20px 16px;display:flex;flex-direction:column;gap:18px">
  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="rec-name" style="font-size:14px;font-weight:600;color:#55625C">Full name</label>
    <input id="rec-name" type="text" autocomplete="off" placeholder="Name as it appears on the wallet" value="{{newName}}" onInput="{{onNewName}}" onChange="{{onNewName}}" style="height:52px;border:1.5px solid #DCE3DF;border-radius:14px;padding:0 14px;font-family:inherit;font-size:16px;color:#14201B;background:#FFFFFF;width:100%">
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span style="font-size:14px;font-weight:600;color:#55625C">Receives money on</span>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{methodOpts}}" as="m" hint-placeholder-count="3">
      <button onClick="{{m.pick}}" style="border:1.5px solid #DCE3DF;background:#FFFFFF;color:#14201B;border-radius:999px;padding:0 16px;height:44px;font-size:14px;font-weight:500;cursor:pointer;{{m.style}}">{{m.label}}</button>
      </sc-for>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="rec-phone" style="font-size:14px;font-weight:600;color:#55625C">Mobile number</label>
    <div style="display:flex;align-items:center;gap:0;border:1.5px solid #DCE3DF;border-radius:14px;background:#FFFFFF;overflow:hidden">
      <span aria-hidden="true" style="padding:0 12px;height:52px;display:flex;align-items:center;background:#EEF2F0;font-weight:600;color:#3F4D46">+221</span>
      <input id="rec-phone" type="tel" inputmode="numeric" autocomplete="off" placeholder="77 123 45 67" aria-describedby="phone-hint" value="{{newPhone}}" onInput="{{onNewPhone}}" onChange="{{onNewPhone}}" style="flex:1;min-width:0;height:52px;border:0;padding:0 14px;font-family:inherit;font-size:16px;color:#14201B;background:transparent">
    </div>
    <span id="phone-hint" style="font-size:14px;color:#55625C">9 digits, starting with 7.</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <label for="rec-phone2" style="font-size:14px;font-weight:600;color:#55625C">Confirm mobile number</label>
    <div style="display:flex;align-items:center;gap:0;border:1.5px solid #DCE3DF;border-radius:14px;background:#FFFFFF;overflow:hidden">
      <span aria-hidden="true" style="padding:0 12px;height:52px;display:flex;align-items:center;background:#EEF2F0;font-weight:600;color:#3F4D46">+221</span>
      <input id="rec-phone2" type="tel" inputmode="numeric" autocomplete="off" placeholder="Type the number again" aria-describedby="phone2-hint" value="{{newPhone2}}" onInput="{{onNewPhone2}}" onChange="{{onNewPhone2}}" onPaste="{{blockPaste}}" style="flex:1;min-width:0;height:52px;border:0;padding:0 14px;font-family:inherit;font-size:16px;color:#14201B;background:transparent">
    </div>
    <span id="phone2-hint" style="font-size:14px;{{phone2HintStyle}}">{{phone2Hint}}</span>
  </div>
  <div style="background:#FFF6DD;border:1.5px solid #F2B33D;border-radius:16px;padding:14px;display:flex;gap:10px;align-items:flex-start">
    <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    <span style="font-size:14px;line-height:1.45">Double-check the number. Money sent to the wrong number can be hard to get back.</span>
  </div>
</div>
<div style="padding:12px 20px 20px;background:#F4F6F5;border-top:1px solid #E1E7E4">
  <button disabled="{{addDisabled}}" onClick="{{saveRecipient}}" style="width:100%;height:52px;border:0;border-radius:14px;background:#0B4F3C;color:#FFFFFF;font-weight:600;font-size:16px;cursor:pointer;{{addStyle}}">Save recipient</button>
</div>
</sc-if>

<!-- PROFILE MENU -->
<sc-if value="{{isProfile}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;gap:4px;padding:12px 12px 4px 8px">
  <button aria-label="Back" onClick="{{goHome}}" style="width:44px;height:44px;border:0;background:transparent;color:#14201B;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700">Profile</h1>
</div>
<div style="flex:1;min-height:0;overflow-y:auto;padding:8px 20px 20px;display:flex;flex-direction:column;gap:16px">
  <div style="display:flex;align-items:center;gap:14px;background:#0B4F3C;color:#FFFFFF;border-radius:20px;padding:18px">
    <span aria-hidden="true" style="width:56px;height:56px;border-radius:50%;background:#F2B33D;color:#14201B;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center;flex:none">SU</span>
    <span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:18px">Sample User</span><span style="font-size:14px;color:#CFE3DA">ID verified</span></span>
  </div>
  <div style="background:#FFFFFF;border:1px solid #DCE3DF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column">
    <sc-for list="{{menuItems}}" as="m" hint-placeholder-count="5">
    <button onClick="{{m.open}}" style="display:flex;align-items:center;gap:12px;width:100%;min-height:68px;text-align:left;border:0;border-bottom:1px solid #EEF2F0;background:transparent;padding:10px 0;cursor:pointer;color:#14201B">
      <span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-weight:600;font-size:16px">{{m.label}}</span><span style="font-size:14px;color:#55625C">{{m.sub}}</span></span>

<script>
class DCLogic{
  constructor(props){this.props=props||{};this.state={};this._q=false;this._cb=null}
  setState(p,cb){const n=typeof p==='function'?p(this.state,this.props):p;if(n)this.state=Object.assign({},this.state,n);if(cb)(this._cbs=this._cbs||[]).push(cb);this._sched()}
  forceUpdate(){this._sched()}
  _sched(){if(this._q||!this._render)return;this._q=true;Promise.resolve().then(()=>{this._q=false;this._render();const c=this._cbs;this._cbs=null;c&&c.forEach(f=>f())})}
}
function DCBoot(Comp){
  const SVG='http://www.w3.org/2000/svg';
  const doc=new DOMParser().parseFromString('<body>'+document.getElementById('tpl').textContent+'</body>','text/html');
  const tplNodes=Array.from(doc.body.childNodes);
  const inst=new Comp({});
  const root=document.getElementById('root');
  const WHOLE=/^\s*\{\{\s*([^}]*?)\s*\}\}\s*$/;
  function look(path,scope,vals){
    if(path==='true')return true;if(path==='false')return false;if(path==='null')return null;
    if(/^-?\d+(\.\d+)?$/.test(path))return Number(path);
    if(/^(['"]).*\1$/.test(path))return path.slice(1,-1);
    const parts=path.split('.');let v=(parts[0] in scope)?scope[parts[0]]:vals[parts[0]];
    for(let i=1;i<parts.length&&v!=null;i++)v=v[parts[i]];
    return v;
  }
  function interp(s,scope,vals){
    const m=s.match(WHOLE);if(m)return look(m[1],scope,vals);
    return s.replace(/\{\{\s*([^}]*?)\s*\}\}/g,(_,p)=>{const v=look(p,scope,vals);return v==null||v===false?'':String(v)});
  }
  function build(nodes,scope,vals,out){
    for(const n of nodes){
      if(n.nodeType===3){const s=n.nodeValue;out.push(s.indexOf('{{')<0?s:String(((v)=>v==null||v===false?'':v)(interp(s,scope,vals))));continue}
      if(n.nodeType!==1)continue;
      const tag=n.localName;
      if(tag==='sc-if'){const v=interp(n.getAttribute('value')||'',scope,vals);if(v)build(Array.from(n.childNodes),scope,vals,out);continue}
      if(tag==='sc-for'){
        const list=interp(n.getAttribute('list')||'',scope,vals)||[];const as=n.getAttribute('as')||'item';
        list.forEach((it,i)=>{const sc=Object.assign({},scope);sc[as]=it;sc.$index=i;build(Array.from(n.childNodes),sc,vals,out)});continue}
      const attrs={},ev={};
      for(const a of Array.from(n.attributes)){
        const name=a.name;if(name.startsWith('hint-'))continue;
        const v=a.value.indexOf('{{')<0?a.value:interp(a.value,scope,vals);
        if(/^on[a-z]/i.test(name)&&typeof v==='function')ev[name.slice(2).toLowerCase()]=v;
        else attrs[name]=v;
      }
      const kids=[];build(Array.from(n.childNodes),scope,vals,kids);
      out.push({tag:tag,ns:n.namespaceURI,attrs,ev,kids});
    }
  }
  const BOOL=['readonly','disabled','checked','selected','multiple','required','autofocus'];
  function create(v){
    if(typeof v==='string')return document.createTextNode(v);
    const el=v.ns&&v.ns!=='http://www.w3.org/1999/xhtml'?document.createElementNS(v.ns,v.tag):document.createElement(v.tag);
    el.__a={};el.__h={};el.__l={};patchEl(el,v);return el;
  }
  function patchEl(el,v){
    const old=el.__a;
    for(const k in old)if(!(k in v.attrs))rm(el,k);
    for(const k in v.attrs){const nv=v.attrs[k];if(old[k]!==nv)setA(el,k,nv)}
    el.__a=v.attrs;
    el.__h=v.ev;
    for(const e in v.ev)if(!el.__l[e]){el.__l[e]=1;el.addEventListener(e,ev=>{const h=el.__h[e];if(h)h(ev)})}
    patchKids(el,v.kids);
    if('value' in v.attrs&&el.tagName==='INPUT'){const s=String(v.attrs.value==null?'':v.attrs.value);if(el.value!==s)el.value=s}
  }
  function rm(el,k){const l=k.toLowerCase();if(BOOL.includes(l)){el.removeAttribute(k);if(l==='readonly')el.readOnly=false;return}el.removeAttribute(k)}
  function setA(el,k,v){
    const l=k.toLowerCase();
    if(BOOL.includes(l)){if(v&&v!=='false')el.setAttribute(k,'');else el.removeAttribute(k);return}
    if(v==null||v===false){el.removeAttribute(k);return}
    if(l==='value'&&el.tagName==='INPUT'){return}
    el.setAttribute(k,v===true?'':String(v));
  }
  function same(d,v){return typeof v==='string'?d.nodeType===3:(d.nodeType===1&&d.localName===v.tag)}
  function patchKids(parent,kids){
    let i=0;
    for(;i<kids.length;i++){
      const v=kids[i],d=parent.childNodes[i];
      if(!d){parent.appendChild(create(v));continue}
      if(!same(d,v)){parent.replaceChild(create(v),d);continue}
      if(typeof v==='string'){if(d.nodeValue!==v)d.nodeValue=v}else patchEl(d,v);
    }
    while(parent.childNodes.length>kids.length)parent.removeChild(parent.lastChild);
  }
  function fit(){
    const s=Math.min(1,window.innerWidth/390,window.innerHeight/844);
    const f=document.getElementById('frame');
    root.style.transform='scale('+s+')';
    f.style.width=(390*s)+'px';f.style.height=(844*s)+'px';
  }
  inst._render=function(){
    const vals=inst.renderVals();const out=[];
    build(tplNodes,{},vals,out);patchKids(root,out);
  };
  window.addEventListener('resize',fit);fit();
  inst._render();
  if(inst.componentDidMount)inst.componentDidMount();
}

  ordinal(n) { const s = ['th', 'st', 'nd', 'rd']; const v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  fmtUsd(n) { return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  fmtNum(n) { return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  fmtXof(n) { return this.fmtNum(n) + ' FCFA'; }
  cleanNum(v, allowDot) {
    let t = String(v || '').replace(allowDot ? /[^0-9.]/g : /[^0-9]/g, '');
    if (allowDot) {
      const i = t.indexOf('.');
      if (i >= 0) t = t.slice(0, i + 1) + t.slice(i + 1).replace(/\./g, '').slice(0, 2);

  }
  parseDate(str) {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || '');
    if (!m) return null;
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  }
  occAt(anchor, freq, i) {
    if (freq === 'monthly') {
      const y = anchor.getFullYear();
      const mo = anchor.getMonth() + i;
      const dim = new Date(y, mo + 1, 0).getDate();
      return new Date(y, mo, Math.min(anchor.getDate(), dim));
    }
    const step = freq === 'biweekly' ? 14 : 7;
    return new Date(anchor.getFullYear(), anchor.getMonth(), anchor.getDate() + step * i);
  }
  genOcc(start, freq, n) {
    const out = [];
    for (let i = 0; i < n; i++) out.push({ d: this.occAt(start, freq, i), state: 'scheduled' });
    return out;
  }
  freqText(s) {
    const a = s.anchor;
    if (s.freq === 'monthly') return 'Monthly on the ' + this.ordinal(a.getDate());
    if (s.freq === 'biweekly') return 'Every 2 weeks on ' + this.longDays()[a.getDay()];
    return 'Every ' + this.longDays()[a.getDay()];
  }
  seedSchedules() {
    const a1 = new Date(2026, 10, 1);
    const a2 = new Date(2026, 9, 21);
    const r = this.seedRecipients();
    return [
      { id: 1, name: r[0].name, initials: r[0].initials, method: r[0].method, phone: r[0].phone, usd: 400, freq: 'monthly', anchor: a1, status: 'active', occ: this.genOcc(a1, 'monthly', 4),

        past: [{ date: this.fmtDate(new Date(2026, 8, 21)), amount: '$120.00' }] }
    ];
  }
  nextIdx(sc) { return sc.occ.findIndex(function (o) { return o.state === 'scheduled'; }); }
  upd(id, fn) {
    this.setState({ schedules: this.state.schedules.map(function (x) { return x.id === id ? fn(Object.assign({}, x)) : x; }) });
  }
  showToast(msg) {
    this.setState({ toast: msg });

  skipNext(id) {
    const sc = this.state.schedules.find(function (x) { return x.id === id; });
    const i = this.nextIdx(sc);
    if (i < 0) return;
    const label = this.fmtDate(sc.occ[i].d);
    this.upd(id, (x) => {
      x.occ = x.occ.map(function (o, j) { return j === i ? { d: o.d, state: 'skipped' } : o; });
      let cnt = x.occ.filter(function (o) { return o.state === 'scheduled'; }).length;
      while (cnt < 3) {
        x.occ = x.occ.concat([{ d: this.occAt(x.anchor, x.freq, x.occ.length), state: 'scheduled' }]);
        cnt++;
      }
      return x;
    });
    this.showToast('Skipped ' + label + '. The rest of your plan stays active.');
  }

      onCardName: (e) => this.setState({ cardName: e.target.value }),
      onCardNum: (e) => this.setState({ cardNum: this.cleanNum(e.target.value, false).slice(0, 16) }),
      onCardExp: (e) => this.setState({ cardExp: this.cleanNum(e.target.value, false).slice(0, 4) }),
      onCardCvv: (e) => this.setState({ cardCvv: this.cleanNum(e.target.value, false).slice(0, 4) }),
      addCardDisabled: addCardDisabled,
      addCardStyle: addCardDisabled ? dim : '',
      cardFromPay: s.cardFrom === 'pay',
      cancelAddCard: () => this.setState({ screen: s.cardFrom === 'methods' ? 'payMethods' : 'home' }),
      saveCard: () => {
        if (addCardDisabled) return;
        const first = s.cardNum.charAt(0);
        const brand = first === '4' ? 'Visa' : (first === '5' ? 'Mastercard' : (first === '3' ? 'Amex' : 'Card'));
        const created = { id: 'n' + Date.now(), kind: 'card', enabled: true, label: brand + ' debit ···· ' + s.cardNum.slice(-4), sub: 'Added just now' };
        if (s.cardFrom === 'methods') {
          this.setState({
            cards: this.state.cards.concat([created]), screen: 'payMethods',
            cardName: '', cardNum: '', cardExp: '', cardCvv: ''
          });
          this.showToast(created.label + ' added.');
        } else {
          this.setState({
            cards: this.state.cards.concat([created]), card: created.id, screen: 'home',
            amountStr: '', startStr: '', recurring: false, mode: 'usd',
            cardName: '', cardNum: '', cardExp: '', cardCvv: ''
          });
          this.showToast(created.label + ' added. Start your transfer again to use it.');
        }
      },
      payText: s.recurring ? 'Authorize and start plan' : (card.kind === 'wallet' ? 'Pay ' + this.fmtUsd(total) + ' with ' + card.label : 'Pay ' + this.fmtUsd(total)),
      payNote: s.recurring
        ? 'You are charged on each transfer date, not today. The rate is set when each transfer is sent. Prototype only: rate, fee and cards are sample values.'
        : 'Prototype only: rate, fee and cards are sample values.',
      confirmPay: () => {
        const idRaw = (Math.random().toString(36) + '00000000').slice(2, 10).toUpperCase();
        const txn = {
          recurring: s.recurring, id: (s.recurring ? 'PL-' : 'TX-') + idRaw,
          name: rec.name, initials: rec.initials, method: rec.method,
          usd: usdN, total: total, xof: xofN, cardLabel: card.label,
          startLabel: this.fmtDate(startDate), freqText: this.freqText(planAnchor)
        };
        const patch = { txn: txn, screen: 'progress', sheet: '', progress: 0 };
        if (!s.recurring) {
          patch.activity = [{
            id: txn.id, name: rec.name, initials: rec.initials, method: rec.method, date: 'Today',
            amount: this.fmtUsd(total), status: 'In progress', minsLeft: 30, payLabel: card.label
          }].concat(s.activity);
        }
        if (s.recurring) {
          const id = Math.max.apply(null, this.state.schedules.map(function (x) { return x.id; })) + 1;
          const created = {
            id: id, name: rec.name, initials: rec.initials, method: rec.method, phone: rec.phone,
            usd: usdN, freq: s.freq, anchor: startDate, status: 'active',
            occ: this.genOcc(startDate, s.freq, 4), past: []
          };
          patch.schedules = this.state.schedules.concat([created]);
          patch.lastNewId = id;
        }
        this.setState(patch);
        this.startProgress();
      },

      // progress
      progCancelled: !!t.cancelled,
      progSteps: !t.cancelled,
      progComplete: p >= 4 && !t.cancelled,
      progWorking: p < 4 && !t.cancelled,
      progTitle: t.cancelled ? 'Transfer cancelled' : (p >= 4 ? (t.recurring ? 'Plan created' : 'Money delivered') : (t.recurring ? 'Setting up your plan' : 'Sending your money')),
      progBody: t.cancelled
        ? 'Nothing was sent to ' + (t.name || '') + '.'
        : (p >= 4
          ? (t.recurring ? 'Your first transfer to ' + t.name + ' goes out on ' + t.startLabel + '.' : t.name + ' received ' + this.fmtXof(t.xof || 0) + ' on ' + t.method + '.')
          : 'This takes a few seconds. You can leave this screen and we keep going.'),
      progRefund: this.fmtUsd(t.total || 0) + ' is going back to ' + (t.cardLabel || 'your payment method') + '. It can take a few business days to show in your account.',
      showCancelNote: !t.cancelled && !t.recurring,
      progCancelNote: p < 4 ? 'You can cancel within 30 minutes of sending, until the money is delivered.' : 'This transfer is delivered, so it can no longer be cancelled.',
      progCanCancel: p < 4 && !t.cancelled && !t.recurring,
      openCancelProgress: () => this.setState({ sheet: 'cancel', cancelTarget: t.id }),
      idLabel: t.recurring ? 'Plan ID' : 'Transaction ID',
      txId: t.id || '',
      txInitials: t.initials || '',
      txName: t.name || '',
      txMethod: t.method || '',
      txUsd: this.fmtUsd(t.recurring ? (t.total || 0) : (t.total || 0)),
      txXof: this.fmtXof(t.xof || 0),
      stepsList: stepsList,
      progViewSchedule: p >= 4 && !!t.recurring,
      progDoneText: p >= 4 ? 'Done' : 'Back to home',
      viewNewSchedule: () => this.setState({ selId: this.state.lastNewId, screen: 'detail' }),

      // reminder
      remDate: remDate,
      remUsd: this.fmtUsd(remUsdNum),
      remName: sch2 ? sch2.name : '',
      remMethod: sch2 ? sch2.method : '',
      remXof: this.fmtXof(Math.floor(remUsdNum * rate)),
      remKeep: () => { this.setState({ reminderDone: true, screen: 'home' }); this.showToast('Got it. The transfer goes out as planned.'); },
      remSkip: () => { this.skipNext(2); this.setState({ reminderDone: true, screen: 'home' }); },
      remPause: () => {
        this.upd(2, function (x) { x.status = 'paused'; return x; });
        this.setState({ reminderDone: true, screen: 'home' });
        this.showToast('Plan paused. Resume it any time from Recurring.');
      },
      remEdit: () => this.setState({ selId: 2, screen: 'detail', reminderDone: true, editStr: String(sch2.usd), editFreq: sch2.freq, sheet: 'edit' }),

      // schedules list
      liveList: live.map(row),
      noLive: live.length === 0,
      hasEnded: ended.length > 0,
      endedList: ended.map(row),

      // detail
      d: d,
      notStopped: !isStopped,
      isActive: isActive, isPaused: isPaused, isStopped: isStopped,
      detailOcc: detailOcc,
      hasPast: !!(sc.past && sc.past.length),
      pastList: sc.past || [],
      skipDisabled: skipDisabled,
      skipStyle: skipDisabled ? dim : '',
      doSkip: () => { if (!skipDisabled) this.skipNext(sc.id); },
      pauseLabel: isPaused ? 'Resume' : 'Pause',
      doPauseToggle: () => {
        if (isPaused) {
          this.upd(sc.id, function (x) { x.status = 'active'; return x; });
          this.showToast('Plan resumed. Transfers will go out on schedule.');
        } else {
          this.setState({ sheet: 'pause' });
        }
      },
      openEdit: () => this.setState({ sheet: 'edit', editStr: String(sc.usd), editFreq: sc.freq }),
      openStop: () => this.setState({ sheet: 'stop' }),

      // activity
      activity: actList,

      // sheets
      hasSheet: s.sheet !== '',
      sheetStop: s.sheet === 'stop',
      sheetPause: s.sheet === 'pause',
      sheetEdit: s.sheet === 'edit',
      closeSheet: () => this.setState({ sheet: '', cardOpen: false, addWarn: false }),
      confirmStop: () => {
        this.upd(sc.id, function (x) {
          x.status = 'stopped';
          x.occ = x.occ.map(function (o) { return o.state === 'scheduled' ? { d: o.d, state: 'cancelled' } : o; });
          return x;
        });
        this.setState({ sheet: '' });
        this.showToast('Plan stopped. Your history is kept.');
      },
      confirmPause: () => {
        this.upd(sc.id, function (x) { x.status = 'paused'; return x; });
        this.setState({ sheet: '' });
        this.showToast('Plan paused. Nothing is charged until you resume.');
      },
      editStr: s.editStr,
      onEditAmount: (e) => this.setState({ editStr: this.cleanNum(e.target.value, true) }),
      editHint: s.editStr !== '' && !editOk ? 'Enter an amount between $10 and $2,500.' : 'Between $10 and $2,500 per transfer.',
      editHintStyle: s.editStr !== '' && !editOk ? 'color:#B3261E;' : 'color:#55625C;',
      editDisabled: !editOk,
      editBtnStyle: editOk ? '' : dim,
      editFreqOpts: editFreqOpts,
      editNote: scNext
        ? 'Changes apply from ' + this.fmtDate(scNext.d) + ' onward. A transfer inside the 3 business day cutoff can no longer be changed.'
        : 'Changes apply to the next transfer.',
      saveEdit: () => {
        const amt = parseFloat(this.state.editStr) || 0;
        const fq = this.state.editFreq;
        if (!(amt >= 10 && amt <= 2500)) return;
        this.upd(sc.id, (x) => {
          x.usd = amt;
          if (fq !== x.freq) {
            const i = this.nextIdx(x);
            const from = i >= 0 ? x.occ[i].d : x.anchor;
            x.freq = fq;
            x.anchor = from;
            x.occ = this.genOcc(from, fq, 4);
          }
          return x;
        });
        this.setState({ sheet: '' });
        this.showToast('Plan updated.');
      },

      // profile
      openProfile: () => this.setState({ screen: 'profile' }),
      backProfile: () => this.setState({ screen: 'profile' }),
      menuItems: [
        { label: 'Profile information', sub: 'Name, contact and ID verification', open: () => this.setState({ screen: 'profileInfo' }) },
        { label: 'Payment methods', sub: 'Debit cards, bank accounts, Apple Pay, Google Pay', open: () => this.setState({ screen: 'payMethods' }) },
        { label: 'Recipients', sub: s.recipients.length + ' saved', open: () => this.setState({ screen: 'recipientsList' }) },
        { label: 'Settings', sub: 'Notifications, language and security', open: () => this.setState({ screen: 'settings' }) },
        { label: 'Help and support', sub: 'WhatsApp, phone and FAQs', open: () => this.setState({ screen: 'help' }) }
      ],
      logOut: () => this.showToast('Logged out (prototype only).'),
      infoRows: [
        { k: 'Full name', v: 'Sample User' },
        { k: 'Email', v: 'sample@email.com' },
        { k: 'Mobile', v: '+1 555 010 0199' },
        { k: 'Address', v: '123 Example St, Detroit, MI 48201' },
        { k: 'Date of birth', v: '01 Jan 1990' }
      ],
      limitRows: [
        { k: 'Per transfer', v: '$10 to $2,500' },
        { k: 'Verification', v: 'ID verified' }
      ],
      raiseLimits: () => this.showToast('Higher limits need extra documents (prototype only).'),

      // payment methods page
      savedMethods: s.cards.filter(function (c) { return c.kind !== 'wallet'; }).map((c) => ({
        label: c.label, sub: c.sub,
        remove: () => {
          const rest = this.state.cards.filter(function (x) { return x.id !== c.id; });
          const usable = rest.filter(function (x) { return x.kind !== 'wallet' || x.enabled; });
          if (usable.length === 0) { this.showToast('Keep at least one payment method.'); return; }
          this.setState({ cards: rest, card: this.state.card === c.id ? usable[0].id : this.state.card });
          this.showToast(c.label + ' removed.');
        }
      })),
      addDebitFromMethods: () => this.setState({ screen: 'addCard', cardFrom: 'methods', cardName: '', cardNum: '', cardExp: '', cardCvv: '' }),
      walletRows: s.cards.filter(function (c) { return c.kind === 'wallet'; }).map((w) => ({
        label: w.label, sub: w.enabled ? 'Connected' : w.sub,
        btnText: w.enabled ? 'Disconnect' : 'Connect',
        btnStyle: w.enabled ? 'background:#FFFFFF;color:#14201B;' : 'background:#0B4F3C;color:#FFFFFF;border-color:#0B4F3C;',
        toggle: () => {
          const next = this.state.cards.map(function (x) { return x.id === w.id ? Object.assign({}, x, { enabled: !x.enabled }) : x; });
          const usable = next.filter(function (x) { return x.kind !== 'wallet' || x.enabled; });
          if (usable.length === 0) { this.showToast('Keep at least one payment method.'); return; }
          const stillOk = usable.some((x) => x.id === this.state.card);
          this.setState({ cards: next, card: stillOk ? this.state.card : usable[0].id });
          this.showToast(w.label + (w.enabled ? ' disconnected.' : ' connected.'));
        }
      })),

      // recipients page
      recList: s.recipients.map((r) => ({ name: r.name, initials: r.initials, method: r.method, phone: r.phone })),
      addRecipientFromProfile: openAdd('profile'),

      // settings page
      switchRows: [
        { key: 'push', label: 'Transfer updates', sub: 'Push notifications when money is sent and delivered' },
        { key: 'whatsapp', label: 'WhatsApp updates', sub: 'Also send receipts and updates on WhatsApp' },
        { key: 'bio', label: 'Face ID or fingerprint', sub: 'Use it to open the app and confirm payments' }
      ].map((r) => ({
        label: r.label, sub: r.sub, on: s.sw[r.key],
        trackStyle: s.sw[r.key] ? 'background:#0B4F3C;justify-content:flex-end;' : 'background:#7C8984;justify-content:flex-start;',
        toggle: () => { const next = Object.assign({}, this.state.sw); next[r.key] = !next[r.key]; this.setState({ sw: next }); }
      })),
      langOpts: ['English', 'Français', 'Wolof'].map((l) => ({
        label: l, style: s.lang === l ? sel : '', pick: () => this.setState({ lang: l })
      })),

      // help page
      helpRows: [
        { label: 'Chat on WhatsApp', sub: 'Answers in English, French or Wolof', open: () => this.showToast('Opens WhatsApp in the real app.') },
        { label: 'Call support', sub: 'Hours: [YOUR SUPPORT HOURS]', open: () => this.showToast('Starts a phone call in the real app.') },
        { label: 'Questions and answers', sub: 'Fees, limits, delivery times and cancelling', open: () => this.showToast('Opens the help centre in the real app.') },
        { label: 'Report a problem', sub: 'Tell us about a transfer that went wrong', open: () => this.showToast('Opens a report form in the real app.') }
      ],

      // toast
      hasToast: s.toast !== '',
      toast: s.toast
    };
  }
}

DCBoot(Component);
</script>
</body>
</html>
